plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.co.hanwoo.smartmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.co.hanwoo.smartmanager'
        minSdk 23
        targetSdk 35
        versionCode 50
        versionName '50.0.0'
    }

    signingConfigs {
        release {
            storeFile file('r46-update-key.jks')
            storePassword System.getenv('HANWOO_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'smart-hanwoo-r46'
            keyPassword System.getenv('HANWOO_KEY_PASSWORD') ?: System.getenv('HANWOO_KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
